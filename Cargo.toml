[package]
name = "photo-sorter"
version = "2.0.0"
edition = "2024"
description = "Portable tool that renames and sorts images and videos into 'Month YYYY' folders"
license = "MIT"

[lib]
name = "photo_sorter"
path = "src/lib.rs"

[[bin]]
name = "PhotoSorter"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]

[dependencies]
chrono = "0.4.45"
kamadak-exif = "0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = { version = "1.11", default-features = false, features = ["std", "unicode", "perf"] }
unicode-normalization = "0.1"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui_extras = { version = "0.37.0", default-features = false, optional = true }
rfd = { version = "0.17.2", optional = true }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"

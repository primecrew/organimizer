[package]
name = "organimizer"
version = "3.0.0"
edition = "2024"
description = "PrimeCrew Organimizer: rename and sort files into date folders, and organize movies and TV shows for Plex"
license = "GPL-3.0-or-later"
authors = ["PrimeCrew Software"]

[lib]
name = "organimizer"
path = "src/lib.rs"

[[bin]]
name = "Organimizer"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui", "net"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]
# TMDB lookups (Plex tab): pure-Rust HTTPS client
net = ["dep:ureq"]

[dependencies]
chrono = "0.4.45"
kamadak-exif = "0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = { version = "1.11", default-features = false, features = ["std", "unicode", "perf"] }
unicode-normalization = "0.1"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard"], optional = true }
egui_extras = { version = "0.37.0", default-features = false, optional = true }
rfd = { version = "0.17.2", optional = true }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"], optional = true }
ureq = { version = "2.12", default-features = false, features = ["tls"], optional = true }

[target.'cfg(windows)'.dependencies]
# ShellExecuteW for Help > README.txt and "Open ... Folder" (no shell / cmd);
# EnumDisplayMonitors / GetDpiForMonitor to keep a restored window on screen.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
# headless egui for the text-input regression tests (tests/text_input.rs)
egui = { version = "0.37", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"

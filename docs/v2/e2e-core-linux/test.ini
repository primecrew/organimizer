[General]
include_subfolders = true
[Date]
source = auto
auto_order = filename, exif, modified, created
fallback = modified
[Output]
folder_template = {MMMM} {YYYY}
sort_into_month_folders = true
[Rules]

[Preset:Camera roll]
include_subfolders = true
source = auto
auto_order = filename, exif, modified, created
fallback = modified
folder_template = {MMMM} {YYYY}
sort_into_month_folders = true
rule1 = extension | on | mode=detect
rule2 = date | on | source=plan | fmt=%Y-%m-%d | pos=replace
rule3 = parent | on | pos=suffix | sep=%20-%20
rule4 = serialize | on | start=1 | step=1 | pad=3 | pos=suffix | sep=_ | perfolder=1
rule5 = case | off | mode=upper
rule6 = extcase | on | mode=lower

[Preset:Clean names]
include_subfolders = true
source = auto
fallback = modified
sort_into_month_folders = false
rule1 = regex | on | find=^(IMG%7CVID%7CDSC)_ | with=
rule2 = reformatdate | on | find=%Y%m%d | to=%Y-%m-%d
rule3 = replace | on | find=%20(1) | with=
rule4 = clean | on | us2sp=1
rule5 = translit | on
rule6 = case | on | mode=title
rule7 = insert | off | text=x | pos=prefix
